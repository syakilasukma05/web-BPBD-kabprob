<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Top Arc Path for Text -->
    <path id="textArcTop" d="M 28,100 A 72,72 0 1,1 172,100" fill="none" />
    <!-- Bottom Arc Path for Text -->
    <path id="textArcBottom" d="M 172,100 A 72,72 0 0,1 28,100" fill="none" />
  </defs>

  <!-- Outer Red Ring -->
  <circle cx="100" cy="100" r="96" fill="#cc1111" stroke="#ffffff" stroke-width="4"/>
  <circle cx="100" cy="100" r="72" fill="#ffcc00" stroke="#ffffff" stroke-width="4"/>

  <!-- Top Curved Text (BADAN PENANGGULANGAN BENCANA DAERAH) -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="11.5" fill="#ffffff" letter-spacing="1">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      BADAN PENANGGULANGAN BENCANA DAERAH
    </textPath>
  </text>

  <!-- Bottom Curved Text (KABUPATEN PROBOLINGGO) -->
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="12" fill="#ffffff" letter-spacing="1.5">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      KABUPATEN PROBOLINGGO
    </textPath>
  </text>

  <!-- Center Blue Triangle -->
  <polygon points="100,38 148,118 52,118" fill="#0044aa" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>

  <!-- BPBD Label Banner inside Blue Triangle -->
  <rect x="68" y="102" width="64" height="22" rx="4" fill="#ffffff" stroke="#0044aa" stroke-width="2"/>
  <text x="100" y="118" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="15" fill="#cc1111" text-anchor="middle" letter-spacing="1">BPBD</text>
</svg>
